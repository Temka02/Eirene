image: node:20-alpine

stages:
  - install
  - lint
  - build

cache:
  key:
    files:
      - server/package-lock.json
  paths:
    - server/node_modules/
  policy: pull-push

install_dependencies:
  stage: install
  script:
    - cd server
    - npm ci --ignore-scripts
  cache:
    policy: pull-push
    paths:
      - server/node_modules/

lint:
  stage: lint
  script:
    - cd server
    - if [ ! -d "node_modules" ]; then npm ci; fi
    - npm run lint
  needs:
    - install_dependencies
  cache:
    policy: pull

build:
  stage: build
  script:
    - cd server
    - if [ ! -d "node_modules" ]; then npm ci; fi
    - npm run build
  needs:
    - lint
  artifacts:
    paths:
      - server/dist/
    expire_in: 1 week
  cache:
    policy: pull
